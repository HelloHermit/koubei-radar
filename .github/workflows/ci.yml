name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Exports ANDROID_HOME and accepts the licences. Its default package list ("tools platform-tools") fails because the
      # "tools" package no longer exists, so it installs nothing itself; the pieces the build needs come from the next step.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install the SDK pieces the build needs
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew test assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
